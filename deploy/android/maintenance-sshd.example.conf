Port 8022
AddressFamily inet
ListenAddress 127.0.0.1
HostKey /maintenance-ssh/ssh_host_ed25519_key
PidFile /run/maintenance-sshd.pid
AuthorizedKeysFile /maintenance-ssh/authorized_keys
AllowUsers root
PermitRootLogin prohibit-password
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
UsePAM no
StrictModes yes
DisableForwarding yes
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
PermitUserEnvironment no
PermitUserRC no
UseDNS no
LoginGraceTime 20
MaxAuthTries 3
MaxStartups 5:30:10
ClientAliveInterval 30
ClientAliveCountMax 3
PrintMotd no
PrintLastLog no
LogLevel INFO
# Authenticate in Linux, then enter Android. The root login shell joins PID 1's
# mount namespace; internal SFTP runs directly against the Android filesystem.
ChrootDirectory /proc/1/root
SetEnv PATH=/system/bin:/system/xbin:/vendor/bin:/data/adb/magisk ANDROID_DATA=/data ANDROID_ROOT=/system
Subsystem sftp internal-sftp
